<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>學測倒數 & 讀書計畫</title>

    <!-- ===== PWA 設定 ===== -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050608">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="學測倒數">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- 畫面出現前先套用主題：有手動選過就用選過的，否則跟著手機設定 -->
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('study_theme'); } catch (e) {}
            if (t !== 'light' && t !== 'dark') {
                t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* =====================================================
         * 配色：淺色與深色共用同一套版面，只換顏色
         * ===================================================== */
        :root {
            --bg: #F7F6F2;
            --glow: rgba(233, 177, 84, 0.18);
            --text: #16140F;
            --muted: rgba(22, 20, 15, 0.64);
            --faint: rgba(22, 20, 15, 0.34);
            --line: rgba(22, 20, 15, 0.11);
            --surface: rgba(22, 20, 15, 0.05);
            --surface-2: rgba(22, 20, 15, 0.08);
            --accent: #E9B154;
            --on-accent: #16140F;
            --accent-text: #8F560A;
            --accent-soft: rgba(233, 177, 84, 0.22);
            --important: #D9932B;
            --important-text: #8F560A;
            --important-soft: rgba(233, 177, 84, 0.2);
            --exam: #D92D2D;
            --exam-text: #B91C1C;
            --exam-soft: rgba(217, 45, 45, 0.1);
            --nav-bg: rgba(247, 246, 242, 0.92);
            --modal-bg: #FFFFFF;
            --shadow: 0 20px 50px rgba(22, 20, 15, 0.18);
            --mark-green-bg: rgba(16, 185, 129, 0.16);  --mark-green: #047857;
            --mark-blue-bg: rgba(59, 130, 246, 0.14);   --mark-blue: #1D4ED8;
            --mark-yellow-bg: rgba(245, 158, 11, 0.18); --mark-yellow: #92400E;
            --mark-pink-bg: rgba(236, 72, 153, 0.14);   --mark-pink: #BE185D;
            --s0: #2A78D6; --s1: #EB6834; --s2: #1BAF7A; --s3: #EDA100; --s4: #E87BA4;
        }
        [data-theme="dark"] {
            --bg: #050608;
            --glow: rgba(233, 177, 84, 0.11);
            --text: #F2F0E9;
            --muted: rgba(242, 240, 233, 0.64);
            --faint: rgba(242, 240, 233, 0.34);
            --line: rgba(242, 240, 233, 0.12);
            --surface: rgba(242, 240, 233, 0.06);
            --surface-2: rgba(242, 240, 233, 0.1);
            --accent: #E9B154;
            --on-accent: #050608;
            --accent-text: #E9B154;
            --accent-soft: rgba(233, 177, 84, 0.16);
            --important: #E9B154;
            --important-text: #F0C277;
            --important-soft: rgba(233, 177, 84, 0.16);
            --exam: #FF5A5F;
            --exam-text: #FF7A7E;
            --exam-soft: rgba(255, 90, 95, 0.16);
            --nav-bg: rgba(5, 6, 8, 0.92);
            --modal-bg: #12131A;
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            --mark-green-bg: rgba(16, 185, 129, 0.18);  --mark-green: #34D399;
            --mark-blue-bg: rgba(59, 130, 246, 0.2);    --mark-blue: #7DB2FF;
            --mark-yellow-bg: rgba(245, 158, 11, 0.2);  --mark-yellow: #FBBF24;
            --mark-pink-bg: rgba(236, 72, 153, 0.2);    --mark-pink: #F59AC8;
            --s0: #3987E5; --s1: #D95926; --s2: #199E70; --s3: #C98500; --s4: #D55181;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { background: var(--bg); touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body {
            margin: 0; min-height: 100vh; min-height: 100dvh;
            background: radial-gradient(circle at 50% 18%, var(--glow), transparent 60%) fixed, var(--bg);
            color: var(--text);
            font-family: 'Manrope', 'Noto Sans TC', -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s, color 0.3s;
        }
        button, input, textarea, select { font-family: inherit; color: inherit; }
        button { cursor: pointer; }
        .zh { font-family: 'Noto Sans TC', 'Manrope', sans-serif; }
        .num { font-family: 'Manrope', sans-serif; font-variant-numeric: tabular-nums; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* --- 頂部列 --- */
        .topbar {
            position: sticky; top: 0; z-index: 40;
            display: flex; align-items: center; justify-content: space-between;
            padding: calc(18px + env(safe-area-inset-top)) 20px 12px;
            background: transparent; border-bottom: 1px solid transparent;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .topbar.scrolled { background: var(--bg); }
        .topbar::after {
            content: ''; position: absolute; left: 0; right: 0; top: 100%; height: 24px;
            background: linear-gradient(var(--bg), transparent);
            opacity: 0; transition: opacity 0.2s; pointer-events: none;
        }
        .topbar.scrolled::after { opacity: 1; }
        .topbar-title { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: 0.1em; }
        .topbar-actions { display: flex; gap: 8px; }
        .icon-btn {
            width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0;
            border: 1px solid var(--line); background: transparent;
            display: inline-flex; align-items: center; justify-content: center; padding: 0;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .icon-btn:hover { background: var(--surface); }
        .icon-btn svg { width: 20px; height: 20px; }
        .avatar-btn img { width: 32px; height: 32px; border-radius: 16px; object-fit: cover; }
        [data-theme="dark"] .icon-sun, [data-theme="light"] .icon-moon { display: none; }

        /* --- 主內容 --- */
        .main {
            max-width: 1000px; margin: 0 auto;
            padding: 8px 20px calc(110px + env(safe-area-inset-bottom));
        }
        .narrow { max-width: 520px; margin: 0 auto; }
        .tab { display: none; }
        .tab.active { display: block; animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

        .label { margin: 0; font-size: 11.5px; letter-spacing: 0.24em; color: var(--muted); font-family: 'Noto Sans TC', sans-serif; }
        .block { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 22px; }
        .block-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
        .empty { color: var(--muted); font-size: 14px; padding: 10px 0; margin: 0; font-family: 'Noto Sans TC', sans-serif; }

        /* --- 按鈕 --- */
        .btn {
            min-height: 44px; padding: 0 18px; border-radius: 22px;
            border: 1px solid var(--line); background: transparent;
            font-size: 14px; font-weight: 600; font-family: 'Noto Sans TC', sans-serif;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            transition: background-color 0.2s, border-color 0.2s, transform 0.15s;
        }
        .btn:hover { background: var(--surface); }
        .btn:active { transform: scale(0.97); }
        .btn-accent { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
        .btn-accent:hover { background: var(--accent); filter: brightness(1.05); }
        .btn-outline-accent { border-color: var(--accent); }
        .btn-danger { color: var(--important-text); border-color: var(--important); }
        .btn-small { min-height: 36px; padding: 0 14px; font-size: 13px; }
        .btn-wide { width: 100%; min-height: 50px; border-radius: 25px; }
        .btn svg { width: 18px; height: 18px; flex-shrink: 0; }

        /* =====================================================
         * 1. 倒數
         * ===================================================== */
        .hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 26px 0 6px; }
        .eyebrow {
            margin: 0; color: var(--accent-text); font-size: 11.5px; font-weight: 700;
            letter-spacing: 0.32em; text-indent: 0.32em; font-family: 'Noto Sans TC', 'Manrope', sans-serif;
        }
        .days {
            margin-top: 12px; font-size: clamp(84px, 24vw, 108px); font-weight: 500;
            line-height: 1; letter-spacing: -0.02em;
        }
        .days-label { margin: 10px 0 0; font-size: 12px; font-weight: 600; letter-spacing: 0.5em; text-indent: 0.5em; color: var(--muted); }
        .hms { margin-top: 18px; display: flex; align-items: flex-start; gap: 20px; font-size: 22px; font-weight: 600; }
        .hms > div { display: flex; flex-direction: column; gap: 4px; min-width: 32px; }
        .hms small { font-size: 11px; font-weight: 500; color: var(--muted); font-family: 'Noto Sans TC', sans-serif; }
        .hms .colon { color: var(--faint); }
        .hero-date {
            margin: 18px 0 0; padding: 7px 16px; border-radius: 18px; border: 1px solid var(--line);
            font-size: 13px; color: var(--muted); font-family: 'Noto Sans TC', sans-serif;
        }
        .hero-date strong { color: var(--text); font-family: 'Manrope', sans-serif; font-weight: 700; letter-spacing: 0.02em; }
        .hero-note { margin: 14px 0 0; font-size: 13px; color: var(--muted); font-family: 'Noto Sans TC', sans-serif; min-height: 1em; }

        .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 22px 0 18px; }
        .chip {
            min-height: 38px; padding: 0 16px; border-radius: 19px;
            border: 1px solid var(--line); background: transparent;
            font-size: 13px; font-weight: 500; font-family: 'Noto Sans TC', sans-serif;
        }
        .chip.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); font-weight: 700; }
        .chip.past { color: var(--faint); }

        .check-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
        .check-item { display: flex; align-items: center; gap: 12px; min-height: 46px; font-size: 15px; font-family: 'Noto Sans TC', sans-serif; }
        .check-item .text { flex: 1; word-break: break-word; }
        .check-item.done .text { color: var(--muted); text-decoration: line-through; }
        .subj { font-weight: 700; margin-right: 6px; }
        .checkbox {
            appearance: none; -webkit-appearance: none; margin: 0; flex-shrink: 0;
            width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--faint);
            display: grid; place-content: center; cursor: pointer; transition: all 0.15s;
        }
        .checkbox:checked { background: var(--accent); border-color: var(--accent); }
        .checkbox:checked::after {
            content: ''; width: 10px; height: 6px; margin-top: -2px;
            border-left: 2.5px solid var(--on-accent); border-bottom: 2.5px solid var(--on-accent);
            transform: rotate(-45deg);
        }
        .next-line { margin: 12px 0 0; font-size: 13px; color: var(--muted); font-family: 'Noto Sans TC', sans-serif; }
        .next-line strong { color: var(--accent-text); }
        .count { font-size: 13px; font-weight: 700; color: var(--accent-text); }

        /* =====================================================
         * 2. 每週進度
         * ===================================================== */
        .week-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; }
        .week-center { text-align: center; }
        .week-range { font-size: 17px; font-weight: 700; letter-spacing: 0.04em; }
        .week-sub { font-size: 12px; color: var(--muted); margin-top: 3px; font-family: 'Noto Sans TC', sans-serif; }
        .progress { height: 4px; border-radius: 2px; background: var(--surface-2); margin: 14px 0; overflow: hidden; }
        .progress > div { height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width 0.3s; }
        .week-tools { display: flex; justify-content: center; margin-bottom: 14px; }

        .day-chips { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 18px; }
        .day-chip {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            min-height: 62px; padding: 8px 0; border-radius: 14px;
            border: 1px solid var(--line); background: transparent;
        }
        .day-chip .w { font-size: 11px; color: var(--muted); font-family: 'Noto Sans TC', sans-serif; }
        .day-chip .n { font-size: 16px; font-weight: 700; }
        .day-chip .dot { width: 4px; height: 4px; border-radius: 2px; background: transparent; }
        .day-chip.has .dot { background: var(--accent); }
        .day-chip.today { border-color: var(--accent); }
        .day-chip.selected { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
        .day-chip.selected .w { color: var(--on-accent); opacity: 0.75; }
        .day-chip.selected.has .dot { background: var(--on-accent); }

        .subject-row { display: flex; gap: 14px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); }
        .subject-name { width: 40px; flex-shrink: 0; font-size: 15px; font-weight: 700; padding-top: 8px; font-family: 'Noto Sans TC', sans-serif; }
        .slots { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }

        .slot {
            width: 100%; text-align: left; border: 1px solid transparent;
            font-size: 14px; line-height: 1.45; padding: 9px 12px; border-radius: 10px;
            background: var(--surface); white-space: pre-wrap; word-break: break-word;
            font-family: 'Noto Sans TC', sans-serif; min-height: 40px;
        }
        .slot:hover { background: var(--surface-2); }
        .slot.empty { background: transparent; border: 1px dashed var(--line); color: var(--faint); }
        .slot.done { text-decoration: line-through; opacity: 0.6; }
        .slot.c-green { background: var(--mark-green-bg); color: var(--mark-green); }
        .slot.c-blue { background: var(--mark-blue-bg); color: var(--mark-blue); }
        .slot.c-yellow { background: var(--mark-yellow-bg); color: var(--mark-yellow); }
        .slot.c-pink { background: var(--mark-pink-bg); color: var(--mark-pink); }

        .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .week-table { width: 100%; min-width: 860px; border-collapse: collapse; table-layout: fixed; }
        .week-table th, .week-table td { padding: 5px; vertical-align: top; border-bottom: 1px solid var(--line); }
        .week-table th { font-size: 14px; font-weight: 700; padding: 10px 5px; text-align: left; font-family: 'Noto Sans TC', sans-serif; }
        .week-table th .d { display: block; font-size: 12px; font-weight: 500; color: var(--muted); font-family: 'Manrope', sans-serif; }
        .week-table th.today { color: var(--accent-text); }
        .week-table td.today { background: var(--accent-soft); }
        .week-table .add-hint { opacity: 0; transition: opacity 0.15s; }
        .week-table .slot:hover .add-hint, .week-table .slot:focus-visible .add-hint { opacity: 1; }
        .week-table .subject-col { width: 72px; font-weight: 700; vertical-align: middle; font-family: 'Noto Sans TC', sans-serif; }
        .exam-tag {
            display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 700; padding: 2px 7px;
            border-radius: 6px; background: var(--exam); color: #FFFFFF; font-family: 'Noto Sans TC', sans-serif;
        }
        .important-tag {
            display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px;
            background: var(--important-soft); color: var(--important-text); border: 1px solid var(--important);
            font-family: 'Noto Sans TC', sans-serif;
        }

        .desktop-only { display: none; }
        @media (min-width: 768px) {
            .mobile-only { display: none; }
            .desktop-only { display: block; }
        }

        /* =====================================================
         * 3. 行事曆
         * ===================================================== */
        .cal-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 14px 0 12px; }
        .cal-year { font-size: 11.5px; font-weight: 700; letter-spacing: 0.28em; color: var(--accent-text); }
        .cal-month { font-size: 26px; font-weight: 700; margin-top: 2px; font-family: 'Noto Sans TC', 'Manrope', sans-serif; }
        .cal-nav { display: flex; gap: 8px; }
        .cal-weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
        .cal-weekdays { text-align: center; font-size: 11.5px; color: var(--muted); padding: 6px 0; font-family: 'Noto Sans TC', sans-serif; }
        .cal-cell {
            min-height: 50px; border: none; background: transparent; padding: 4px 2px;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px;
            border-radius: 12px;
        }
        .cal-cell.blank { pointer-events: none; }
        .cal-num {
            width: 34px; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: 600; border: 1.5px solid transparent;
        }
        .cal-cell.past .cal-num { color: var(--faint); }
        .cal-cell.exam .cal-num { border-color: var(--exam); color: var(--exam-text); }
        .cal-cell.selected .cal-num { background: var(--surface-2); }
        .cal-cell.today .cal-num { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
        .cal-dots { display: flex; gap: 3px; height: 6px; align-items: center; }
        .cal-dots i { width: 5px; height: 5px; border-radius: 3px; background: var(--text); }
        .cal-dots i.imp { width: 6px; height: 6px; background: var(--important); }
        .cal-titles { display: none; }

        .legend { display: flex; gap: 18px; justify-content: center; font-size: 11.5px; color: var(--muted); padding: 10px 0 4px; font-family: 'Noto Sans TC', sans-serif; }
        .legend span { display: inline-flex; align-items: center; gap: 6px; }
        .legend i { width: 6px; height: 6px; border-radius: 3px; background: var(--text); }
        .legend i.imp { background: var(--important); }
        .legend i.ring { width: 10px; height: 10px; border-radius: 5px; background: transparent; border: 1.5px solid var(--exam); }

        .event-list { list-style: none; margin: 0; padding: 0; }
        .event-row {
            display: flex; align-items: center; gap: 14px; min-height: 54px; width: 100%;
            background: transparent; border: none; text-align: left; padding: 6px 0; border-radius: 10px;
        }
        .event-row:hover { background: var(--surface); }
        .event-date { width: 48px; text-align: center; flex-shrink: 0; }
        .event-date .d { font-size: 16px; font-weight: 700; }
        .event-date .w { font-size: 11px; color: var(--muted); font-family: 'Noto Sans TC', sans-serif; }
        .event-bar { width: 3px; height: 30px; border-radius: 2px; background: var(--faint); flex-shrink: 0; }
        .event-bar.imp { background: var(--important); }
        .event-bar.exam { background: var(--exam); }
        .event-title { flex: 1; font-size: 15px; min-width: 0; word-break: break-word; font-family: 'Noto Sans TC', sans-serif; }
        .event-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
        #selDayList .event-row { padding-left: 4px; }
        .event-meta { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .event-rel { font-size: 12px; color: var(--muted); font-family: 'Noto Sans TC', sans-serif; }

        .fab {
            position: fixed; right: max(20px, calc(50% - 480px)); bottom: calc(96px + env(safe-area-inset-bottom));
            width: 56px; height: 56px; border-radius: 28px; border: none; z-index: 35;
            background: var(--accent); color: var(--on-accent);
            display: none; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px rgba(233, 177, 84, 0.3);
        }
        .fab svg { width: 24px; height: 24px; }
        body[data-tab="tab-calendar"] .fab { display: flex; }
        #tab-calendar { padding-bottom: 72px; }

        @media (min-width: 768px) {
            .cal-grid { gap: 4px; }
            .cal-cell { min-height: 96px; align-items: stretch; padding: 6px; border: 1px solid var(--line); }
            .cal-cell.blank { border-color: transparent; }
            .cal-num { width: 30px; height: 30px; font-size: 14px; }
            .cal-dots { display: none; }
            .cal-titles { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
            .cal-titles span {
                font-size: 12px; padding: 2px 6px; border-radius: 5px; text-align: left;
                background: var(--surface-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                font-family: 'Noto Sans TC', sans-serif;
            }
            .cal-titles span.imp { background: var(--important-soft); color: var(--important-text); }
            .cal-titles span.exam { background: var(--exam); color: #FFFFFF; font-weight: 700; }
            .cal-cell:hover { background: var(--surface); }
            .cal-cell.selected { border-color: var(--accent); background: var(--accent-soft); }
            .cal-cell.selected .cal-num { background: transparent; }
            .cal-cell.today .cal-num { background: var(--accent); }
            .fab { display: none !important; }  /* 電腦版用「＋ 新增」按鈕，不需要浮動按鈕 */
        }
        @media (min-width: 1000px) {
            .cal-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; align-items: start; }
            .cal-lists { position: sticky; top: 84px; padding-top: 14px; }
            .cal-lists .block:first-child { border-top: none; margin-top: 0; padding-top: 0; }

    <script type="module">
        /* =====================================================
         * 設定區（考試日期、科目都改這裡）
         * ===================================================== */
        const EXAMS = {
            mock1: { name: '第一次模擬考', short: '模考一', date: '2026-09-02', end: '2026-09-03' },
            mock2: { name: '第二次模擬考', short: '模考二', date: '2026-10-28', end: '2026-10-29' },
            mock3: { name: '第三次模擬考', short: '模考三', date: '2026-12-08', end: '2026-12-09' },
            gsat:  { name: '116 學測',     short: '學測',   date: '2027-01-22', end: '2027-01-24' } // 多天的考試加上 end
        };
        // 科目順序不要改，舊的進度資料是靠順序對應的
        const SUBJECTS = ['數學', '自然', '英文', '國文', '社會'];
        const SLOTS = 2;
        const TZ = '+08:00'; // 以台灣時間倒數

        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyCsoIvDKShBF1w39m9JzRNPUrkA4UDx5hk",
            authDomain: "study-countdown.firebaseapp.com",
            projectId: "study-countdown"
        };
        const FIREBASE_VER = '10.8.0';

        const LS = {
            todos: 'study_todos', weekly: 'study_weekly', events: 'study_events',
            exam: 'selectedExamKey', theme: 'study_theme', tab: 'study_tab',
            sessions: 'study_sessions', timer: 'study_timer', tpref: 'study_timer_pref'
        };
        const DEFAULT_AVATAR = 'data:image/svg+xml;utf8,' + encodeURIComponent(
            "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' fill='#E9B154'/>" +
            "<circle cx='20' cy='15' r='7' fill='#16140F'/><path d='M6 37c2-8 8-11 14-11s12 3 14 11' fill='#16140F'/></svg>");

        /* =====================================================
         * 小工具
         * ===================================================== */
        const $ = (id) => document.getElementById(id);
        const pad = (n) => String(n).padStart(2, '0');
        const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        const parseYmd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
        const WEEK_ZH = ['日', '一', '二', '三', '四', '五', '六'];
        const examTime = (date) => new Date(`${date}T00:00:00${TZ}`).getTime();
        const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const todayStr = () => ymd(new Date());

        function lsGet(k, fb) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? fb; } catch { return fb; } }
        function lsSet(k, v) { try { localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v)); } catch {} }

        let toastTimer;
        function toast(msg, action) {
            const el = $('toast');
            el.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button class="toast-btn">${esc(action.label)}</button>` : '');
            el.classList.toggle('has-action', !!action);
            if (action) el.querySelector('.toast-btn').onclick = () => { el.classList.remove('show'); action.fn(); };
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), action ? 4500 : 2200);
        }

        /* =====================================================
         * 資料與儲存
         * ===================================================== */
        let state = { todos: [], events: [], weekly: {}, sessions: [] };
        let currentUser = null;
        let fb = null; // Firebase（動態載入，離線時 App 照常可用）

        // 相容舊版資料：舊的待辦是純文字、舊的行程可能沒有 id
        // 自己加過、和內建考試同一天又同名的行程（例如 1/22「學測」）視為重複，自動移除
        const squash = (t) => String(t || '').replace(/\s/g, '');
        function isExamDuplicate(ev) {
            const t = squash(ev.title);
            if (!t) return false;
            return Object.values(EXAMS).some(x => {
                if (ev.start < x.date || ev.start > (x.end || x.date)) return false;
                const name = squash(x.name);
                return name.includes(t) || t.includes(name) || t.includes(x.short);
            });
        }
        let removedDupes = 0;
        function normalize(raw = {}) {
            removedDupes = 0;
            return {
                todos: (raw.todos || []).map(t => typeof t === 'string'
                    ? { id: uid(), text: t }
                    : { id: t.id || uid(), text: t.text || '' }),
                events: (raw.events || []).filter(e => e && e.start).map(e => ({
                    id: String(e.id || uid()), title: e.title || '', start: String(e.start).slice(0, 10), important: !!e.important
                })).filter(e => { if (isExamDuplicate(e)) { removedDupes++; return false; } return true; }),
                weekly: raw.weekly && typeof raw.weekly === 'object' ? raw.weekly : {},
                sessions: (raw.sessions || []).filter(x => x && x.start && x.minutes > 0).map(x => ({
                    id: String(x.id || uid()), subject: Math.min(4, Math.max(0, x.subject | 0)),
                    start: Number(x.start), minutes: Math.round(x.minutes), pomo: !!x.pomo
                }))
            };
        }
        const isEmpty = (s) => !s.todos.length && !s.events.length && !Object.keys(s.weekly).length && !s.sessions.length;
        const loadLocal = () => normalize({ todos: lsGet(LS.todos, []), events: lsGet(LS.events, []), weekly: lsGet(LS.weekly, {}), sessions: lsGet(LS.sessions, []) });
        function saveLocal() {
            lsSet(LS.todos, state.todos); lsSet(LS.events, state.events); lsSet(LS.weekly, state.weekly); lsSet(LS.sessions, state.sessions);
        }

        let cloudTimer;
        let cloudReady = false;
        const earlySessions = [];   // 讀到雲端資料後才允許寫回，避免空資料蓋掉雲端
        let unsubscribe = null;
        function save() {
            if (!currentUser || !fb) { saveLocal(); return; }
            if (!cloudReady) { toast('還在連線雲端，這次修改可能不會同步'); return; }
            clearTimeout(cloudTimer);
            cloudTimer = setTimeout(async () => {
                try {
                    // mergeFields：只覆蓋這幾個欄位，雲端其他舊資料不受影響
                    await fb.fs.setDoc(fb.fs.doc(fb.db, 'users', currentUser.uid), {
                        todos: state.todos, events: state.events, weekly: state.weekly, sessions: state.sessions, updatedAt: Date.now()
                    }, { mergeFields: ['todos', 'events', 'weekly', 'sessions', 'updatedAt'] });
                } catch (e) {
                    console.error('雲端儲存失敗：', e);
                    toast('雲端儲存失敗，請檢查網路');
                }
            }, 400);
        }

        function renderAll() {
            renderToday();
            renderWeek();
            renderCalendar();
            renderTodos();
            renderTimer();
            renderStats();
        }

        /* =====================================================
         * 主題
         * ===================================================== */
        function applyTheme(t) {
            document.documentElement.setAttribute('data-theme', t);
            document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#050608' : '#F7F6F2');
        }
        applyTheme(document.documentElement.getAttribute('data-theme'));
        $('themeBtn').addEventListener('click', () => {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            applyTheme(next);
            lsSet(LS.theme, next);
        });
        // 沒手動選過時，跟著手機切換深淺色
        window.matchMedia?.('(prefers-color-scheme: light)').addEventListener?.('change', (e) => {
            const saved = localStorage.getItem(LS.theme);
            if (saved !== 'light' && saved !== 'dark') applyTheme(e.matches ? 'light' : 'dark');
        });

        /* =====================================================
         * 分頁
         * ===================================================== */
        const tabBtns = document.querySelectorAll('.tab-btn');
        function showTab(id) {
            if (!document.getElementById(id)) id = 'tab-countdown';
            const navId = id === 'tab-stats' ? 'tab-timer' : id;   // 統計頁屬於「計時」分頁
            const btn = [...tabBtns].find(b => b.dataset.tab === navId) || tabBtns[0];
            tabBtns.forEach(b => b.classList.toggle('active', b === btn));
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === id));
            document.body.dataset.tab = id;
            $('pageTitle').textContent = id === 'tab-stats' ? '讀書統計' : btn.dataset.title;
            lsSet(LS.tab, id);
            applyFocusMode();
            window.scrollTo({ top: 0 });
        }
        tabBtns.forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

        /* =====================================================
         * 彈出視窗
         * ===================================================== */
        // 彈窗開著時，後面的頁面不跟著捲動
        const syncScrollLock = () => document.body.classList.toggle('modal-open', !!document.querySelector('.modal.open'));
        function openModal(id) { $(id).classList.add('open'); syncScrollLock(); }
        function closeModal(id) {
            $(id).classList.remove('open');
            syncScrollLock();
            if (id === 'rouletteModal') stopSpin();
        }
        document.querySelectorAll('.modal').forEach(m => {
            m.addEventListener('click', (e) => { if (e.target === m || e.target.closest('[data-close]')) closeModal(m.id); });
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') document.querySelectorAll('.modal.open').forEach(m => closeModal(m.id));
        });
        function onEnter(el, fn) {
            el.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); fn(); } });
        }

        /* =====================================================
         * 1. 倒數
         * ===================================================== */
        const examEntries = Object.entries(EXAMS).sort((a, b) => a[1].date.localeCompare(b[1].date));
        const examEndTime = (e) => examTime(e.end || e.date) + 86400000;
        const examsOn = (ds) => examEntries.filter(([, e]) => e.date <= ds && ds <= (e.end || e.date)).map(([, e]) => e);
        const shortDate = (s) => { const d = parseYmd(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
        const examTitle = (e) => e.end ? `${e.name}（${shortDate(e.date)}–${shortDate(e.end)}）` : e.name;
        let examKey = localStorage.getItem(LS.exam);
        if (!EXAMS[examKey]) examKey = 'gsat';

        function renderExamChips() {
            const now = Date.now();
            $('examChips').innerHTML = examEntries.map(([k, e]) => {
                const cls = ['chip', k === examKey ? 'active' : '', examEndTime(e) <= now ? 'past' : ''].join(' ');
                return `<button class="${cls}" role="tab" aria-selected="${k === examKey}" data-exam="${k}">${esc(e.short)}</button>`;
            }).join('');
        }
        $('examChips').addEventListener('click', (e) => {
            const b = e.target.closest('[data-exam]');
            if (!b) return;
            examKey = b.dataset.exam;
            lsSet(LS.exam, examKey);
            renderExamChips();
            tick();
        });

        function tick() {
            const now = Date.now();
            const exam = EXAMS[examKey];
            const diff = examTime(exam.date) - now;
            $('cdEyebrow').textContent = `${exam.date.slice(0, 4)} · ${exam.name}`;
            const ed = parseYmd(exam.date);
            let dateHtml = `考試日期 <strong>${ed.getFullYear()}/${pad(ed.getMonth() + 1)}/${pad(ed.getDate())}</strong>（${WEEK_ZH[ed.getDay()]}）`;
            if (exam.end) {
                const ee = parseYmd(exam.end);
                dateHtml += ` – <strong>${pad(ee.getMonth() + 1)}/${pad(ee.getDate())}</strong>（${WEEK_ZH[ee.getDay()]}）`;
            }
            $('cdDate').innerHTML = dateHtml;
            if (diff > 0) {
                $('days').textContent = pad(Math.floor(diff / 86400000));
                $('hours').textContent = pad(Math.floor(diff % 86400000 / 3600000));
                $('minutes').textContent = pad(Math.floor(diff % 3600000 / 60000));
                $('seconds').textContent = pad(Math.floor(diff % 60000 / 1000));
                $('cdNote').textContent = '';
            } else {
                ['days', 'hours', 'minutes', 'seconds'].forEach(id => $(id).textContent = '00');
                $('cdNote').textContent = now < examEndTime(exam) ? '考試進行中，加油！' : '這場已經考完了，辛苦了！';
            }
            const next = examEntries.map(([, e]) => ({ ...e, diff: examTime(e.date) - now }))
                .filter(e => e.diff > 0).sort((a, b) => a.diff - b.diff)[0];
            $('nextExamLine').innerHTML = next
                ? `下一場：${esc(next.name)} · 還有 <strong>${Math.ceil(next.diff / 86400000)}</strong> 天`
                : '所有考試都完成了，恭喜！';
        }

        // 今日進度：讀取每週進度表中「今天」有寫內容的格子
        function renderToday() {
            const t = todayStr();
            const items = [];
            SUBJECTS.forEach((subj, s) => {
                for (let slot = 0; slot < SLOTS; slot++) {
                    const key = `${t}_${s}_${slot}`;
                    const d = state.weekly[key];
                    if (d && d.text) items.push({ key, subj, text: d.text, done: !!d.done });
                }
            });
            const done = items.filter(i => i.done).length;
            $('todayCount').textContent = items.length ? `${done} / ${items.length}` : '';
            $('todayList').innerHTML = items.length
                ? items.map(i => `
                    <li class="check-item ${i.done ? 'done' : ''}">
                        <input type="checkbox" class="checkbox" data-key="${i.key}" ${i.done ? 'checked' : ''} aria-label="完成 ${esc(i.subj)}">
                        <span class="text"><span class="subj">${esc(i.subj)}</span>${esc(i.text)}</span>
                    </li>`).join('')
                : `<li class="empty">今天還沒安排進度，<button class="btn btn-small" id="goWeekBtn">去安排</button></li>`;
        }
        $('todayList').addEventListener('change', (e) => {
            const key = e.target.dataset.key;
            if (!key || !state.weekly[key]) return;
            state.weekly[key].done = e.target.checked;
            save(); renderToday(); renderWeek();
        });
        $('todayList').addEventListener('click', (e) => {
            if (e.target.id === 'goWeekBtn') { weekMonday = getMonday(new Date()); selectedDayIdx = null; renderWeek(); showTab('tab-weekly'); }
        });

        /* --- 轉盤 --- */
        let spinI = null, spinT = null;
        function stopSpin() { clearInterval(spinI); clearTimeout(spinT); spinI = spinT = null; }
        function spin() {
            stopSpin();
            $('rouletteBtns').style.visibility = 'hidden';
            let i = 0;
            spinI = setInterval(() => { $('rouletteResult').textContent = SUBJECTS[i++ % SUBJECTS.length]; }, 80);
            spinT = setTimeout(() => {
                stopSpin();
                $('rouletteResult').textContent = SUBJECTS[Math.floor(Math.random() * SUBJECTS.length)];
                $('rouletteBtns').style.visibility = 'visible';
            }, 1800);
        }
        $('rouletteBtn').addEventListener('click', () => { openModal('rouletteModal'); spin(); });
        $('spinAgainBtn').addEventListener('click', spin);

        /* =====================================================
         * 2. 每週進度
         * ===================================================== */
        function getMonday(d) {
            const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            x.setDate(x.getDate() - (x.getDay() + 6) % 7);
            return x;
        }
        let weekMonday = getMonday(new Date());
        let selectedDayIdx = null; // null = 自動（本週選今天，其他週選星期一）
        let editingKey = null;
        let pickedColor = '';

        function weekDays() {
            return Array.from({ length: 7 }, (_, i) => { const d = new Date(weekMonday); d.setDate(d.getDate() + i); return d; });
        }
        function slotHtml(key, title) {
            const d = state.weekly[key];
            const cls = ['slot'];
            if (!d || (!d.text && !d.color && !d.done)) cls.push('empty');
            if (d?.done) cls.push('done');
            if (d?.color) cls.push(`c-${d.color}`);
            const text = d?.text ? esc(d.text) : (d?.done || d?.color ? '' : '<span class="add-hint">＋ 新增</span>');
            return `<button class="${cls.join(' ')}" data-key="${key}" data-title="${esc(title)}">${text}</button>`;
        }

        function renderWeek() {
            const days = weekDays();
            const t = todayStr();
            const fmt = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
            $('weekRange').textContent = `${fmt(days[0])} – ${fmt(days[6])}`;

            let total = 0, done = 0;
            days.forEach(d => SUBJECTS.forEach((_, s) => { for (let k = 0; k < SLOTS; k++) {
                const v = state.weekly[`${ymd(d)}_${s}_${k}`];
                if (v && v.text) { total++; if (v.done) done++; }
            } }));
            const pct = total ? Math.round(done / total * 100) : 0;
            $('weekBar').style.width = pct + '%';
            $('weekSub').textContent = total ? `本週完成 ${done} / ${total} · ${pct}%` : '本週還沒有安排進度';

            const todayIdx = days.findIndex(d => ymd(d) === t);
            $('thisWeekBtn').parentElement.style.display = todayIdx >= 0 ? 'none' : '';
            const sel = selectedDayIdx ?? (todayIdx >= 0 ? todayIdx : 0);

            // 手機：日期選擇＋當天各科
            $('dayChips').innerHTML = days.map((d, i) => {
                const ds = ymd(d);
                const has = SUBJECTS.some((_, s) => [...Array(SLOTS).keys()].some(k => state.weekly[`${ds}_${s}_${k}`]?.text));
                const cls = ['day-chip', has ? 'has' : '', ds === t ? 'today' : '', i === sel ? 'selected' : ''].join(' ');
                return `<button class="${cls}" data-idx="${i}" aria-label="${fmt(d)} 星期${WEEK_ZH[d.getDay()]}"><span class="w">${WEEK_ZH[d.getDay()]}</span><span class="n num">${d.getDate()}</span><span class="dot"></span></button>`;
            }).join('');
            const sd = days[sel], sds = ymd(sd);
            const exams = examsOn(sds).map(e => e.name);
            $('dayLabel').textContent = `${sd.getMonth() + 1} 月 ${sd.getDate()} 日 · 星期${WEEK_ZH[sd.getDay()]}${exams.length ? ' · ' + exams.join('、') : ''}`;
            $('dayPlan').innerHTML = SUBJECTS.map((subj, s) => `
                <div class="subject-row">
                    <div class="subject-name">${subj}</div>
                    <div class="slots">${[...Array(SLOTS).keys()]
                        .filter(k => k === 0 || state.weekly[`${sds}_${s}_${k - 1}`]?.text || state.weekly[`${sds}_${s}_${k}`])
                        .map(k => slotHtml(`${sds}_${s}_${k}`, `${fmt(sd)} ${subj}`)).join('')}</div>
                </div>`).join('');

            // 電腦：整週表格
            let html = '<thead><tr><th class="subject-col">科目</th>';
            days.forEach(d => {
                const ds = ymd(d);
                const tags = examsOn(ds).map(e => `<span class="exam-tag">${esc(e.short)}</span>`).join(' ');
                html += `<th class="${ds === t ? 'today' : ''}">星期${WEEK_ZH[d.getDay()]}<span class="d">${fmt(d)}</span>${tags}</th>`;
            });
            html += '</tr></thead><tbody>';
            SUBJECTS.forEach((subj, s) => {
                for (let k = 0; k < SLOTS; k++) {
                    html += '<tr>';
                    if (k === 0) html += `<td class="subject-col" rowspan="${SLOTS}">${subj}</td>`;
                    days.forEach(d => {
                        const ds = ymd(d);
                        html += `<td class="${ds === t ? 'today' : ''}">${slotHtml(`${ds}_${s}_${k}`, `${fmt(d)} ${subj}`)}</td>`;
                    });
                    html += '</tr>';
                }
            });
            $('weekTable').innerHTML = html + '</tbody>';
        }

        $('tab-weekly').addEventListener('click', (e) => {
            const chip = e.target.closest('.day-chip');

        $('prevWeekBtn').addEventListener('click', () => { weekMonday.setDate(weekMonday.getDate() - 7); selectedDayIdx = null; renderWeek(); });
        $('nextWeekBtn').addEventListener('click', () => { weekMonday.setDate(weekMonday.getDate() + 7); selectedDayIdx = null; renderWeek(); });
        $('thisWeekBtn').addEventListener('click', () => { weekMonday = getMonday(new Date()); selectedDayIdx = null; renderWeek(); });

        const colorDots = document.querySelectorAll('.color-dot');
        function pickColor(c) { pickedColor = c; colorDots.forEach(d => d.classList.toggle('selected', d.dataset.color === c)); }
        colorDots.forEach(d => d.addEventListener('click', () => pickColor(d.dataset.color)));

        function openWeeklyModal(key, title) {

        $('weeklyText').addEventListener('keydown', (e) => {

        $('saveWeeklyBtn').addEventListener('click', () => {
            const text = $('weeklyText').value.trim();
            const done = $('weeklyDone').checked;
            if (!text && !done && !pickedColor) delete state.weekly[editingKey];
            else state.weekly[editingKey] = { text, done, color: pickedColor };

        });
        $('clearWeeklyBtn').addEventListener('click', () => {
            const key = editingKey, old = state.weekly[key];

            save(); renderWeek(); renderToday();
            closeModal('weeklyModal');
            if (old) toast('已清除', { label: '復原', fn: () => { state.weekly[key] = old; save(); renderWeek(); renderToday(); } });
        });

        /* =====================================================
         * 3. 行事曆
         * ===================================================== */
        let calY = new Date().getFullYear(), calM = new Date().getMonth();
        let selDate = todayStr();
        let editingEventId = null;

        const eventsOn = (ds) => state.events.filter(e => e.start === ds).sort((a, b) => (b.important - a.important));

        function renderCalendar() {
            const t = todayStr();
            $('calYear').textContent = calY;
            $('calMonth').textContent = `${calM + 1} 月`;
            const first = new Date(calY, calM, 1);
            const offset = (first.getDay() + 6) % 7;
            const total = new Date(calY, calM + 1, 0).getDate();
            let html = '';
            for (let i = 0; i < offset; i++) html += '<div class="cal-cell blank"></div>';
            for (let n = 1; n <= total; n++) {
                const ds = `${calY}-${pad(calM + 1)}-${pad(n)}`;
                const evs = eventsOn(ds), exs = examsOn(ds);
                const cls = ['cal-cell', ds === t ? 'today' : '', ds < t ? 'past' : '', ds === selDate ? 'selected' : '', exs.length ? 'exam' : ''].join(' ');
                const dots = evs.slice(0, 3).map(e => `<i class="${e.important ? 'imp' : ''}"></i>`).join('');
                const titles = [
                    ...exs.map(e => `<span class="exam">${esc(e.short)}</span>`),
                    ...evs.map(e => `<span class="${e.important ? 'imp' : ''}">${esc(e.title)}</span>`)
                ].slice(0, 3).join('');
                const label = `${calM + 1}月${n}日${exs.length ? '，考試' : ''}${evs.length ? `，${evs.length} 個行程` : ''}`;
                html += `<button class="${cls}" data-date="${ds}" aria-label="${label}"><span class="cal-num num">${n}</span><span class="cal-dots">${dots}</span><span class="cal-titles">${titles}</span></button>`;
            }
            const rest = (7 - (offset + total) % 7) % 7;
            for (let i = 0; i < rest; i++) html += '<div class="cal-cell blank"></div>';
            $('calGrid').innerHTML = html;
            renderDayList();
            renderUpcoming();
        }

        function eventRowHtml(item, showRel) {
            const d = parseYmd(item.date);
            const t = todayStr();
            const rel = showRel ? daysBetween(t, item.date) : null;
            const dateBlock = showRel ? `<div class="event-date"><div class="d num">${d.getMonth() + 1}/${d.getDate()}</div><div class="w">週${WEEK_ZH[d.getDay()]}</div></div>` : '';
            const tags = (item.exam ? '<span class="exam-tag" style="margin:0">考試</span>' : '') +
                (item.important ? '<span class="important-tag">重要</span>' : '');
            return `<li><button class="event-row" ${item.id ? `data-id="${item.id}"` : 'data-exam="1"'} data-title="${esc(item.title)}">
                ${dateBlock}
                <div class="event-bar ${item.exam ? 'exam' : item.important ? 'imp' : ''}"></div>
                <div class="event-title">${esc(item.title)}${item.sub ? `<div class="event-sub">${esc(item.sub)}</div>` : ''}</div>
                <div class="event-meta">${tags}${rel !== null ? `<span class="event-rel">${rel === 1 ? '明天' : rel + ' 天後'}</span>` : ''}</div>
            </button></li>`;
        }

        function renderDayList() {
            const t = todayStr();
            const d = parseYmd(selDate);
            $('selDayTitle').textContent = `${d.getMonth() + 1} 月 ${d.getDate()} 日 · 星期${WEEK_ZH[d.getDay()]}${selDate === t ? '（今天）' : ''}`;
            const items = [
                ...examsOn(selDate).map(e => ({
                    date: selDate, title: e.name, exam: true,
                    sub: e.end ? `第 ${daysBetween(e.date, selDate) + 1} 天，共 ${daysBetween(e.date, e.end) + 1} 天` : ''
                })),
                ...eventsOn(selDate).map(e => ({ id: e.id, date: e.start, title: e.title, important: e.important }))
            ];
            $('selDayList').innerHTML = items.length ? items.map(i => eventRowHtml(i, false)).join('') : '<li class="empty">這天沒有行程</li>';
        }

        function renderUpcoming() {
            const t = todayStr();
            const items = [
                ...examEntries.map(([, e]) => ({ date: e.date, title: e.name, exam: true, sub: e.end ? `${shortDate(e.date)} – ${shortDate(e.end)}，共 ${daysBetween(e.date, e.end) + 1} 天` : '' })),
                ...state.events.map(e => ({ id: e.id, date: e.start, title: e.title, important: e.important }))
            ].filter(i => i.date > t).sort((a, b) => a.date.localeCompare(b.date) || (b.exam ? 1 : 0) - (a.exam ? 1 : 0)).slice(0, 8);
            $('upcomingList').innerHTML = items.length ? items.map(i => eventRowHtml(i, true)).join('') : '<li class="empty">接下來沒有安排</li>';
        }

        $('calGrid').addEventListener('click', (e) => {
            const c = e.target.closest('.cal-cell[data-date]');
            if (!c) return;
            if (c.dataset.date === selDate) { openEventModal({ date: selDate }); return; } // 再點一次同一天 → 新增
            selDate = c.dataset.date;
            renderCalendar();
        });
        function onEventListClick(e) {
            const row = e.target.closest('.event-row');
            if (!row) return;
            if (row.dataset.exam) { toast(`${row.dataset.title} 是固定的考試日期`); return; }
            openEventModal({ id: row.dataset.id });
        }
        $('selDayList').addEventListener('click', onEventListClick);
        $('upcomingList').addEventListener('click', onEventListClick);

        function moveMonth(delta) {
            calM += delta;
            if (calM < 0) { calM = 11; calY--; }
            if (calM > 11) { calM = 0; calY++; }
            renderCalendar();
        }
        $('prevMonthBtn').addEventListener('click', () => moveMonth(-1));
        $('nextMonthBtn').addEventListener('click', () => moveMonth(1));
        $('todayMonthBtn').addEventListener('click', () => {
            const n = new Date(); calY = n.getFullYear(); calM = n.getMonth(); selDate = todayStr(); renderCalendar();
        });
        $('calFab').addEventListener('click', () => openEventModal({ date: selDate }));
        $('addOnDayBtn').addEventListener('click', () => openEventModal({ date: selDate }));

        function openEventModal({ id, date }) {
            const ev = id ? state.events.find(e => e.id === id) : null;
            editingEventId = ev ? ev.id : null;
            $('eventTitle').textContent = ev ? '編輯行程' : '新增行程';
            $('eventName').value = ev ? ev.title : '';
            $('eventDate').value = ev ? ev.start : (date || todayStr());
            $('eventImportant').checked = ev ? ev.important : false;
            $('deleteEventBtn').style.display = ev ? '' : 'none';
            openModal('eventModal');
            setTimeout(() => $('eventName').focus(), 120);
        }
        function saveEvent() {
            const title = $('eventName').value.trim();
            const start = $('eventDate').value;
            if (!title) { toast('請輸入行程內容'); return; }
            if (!start) { toast('請選擇日期'); return; }
            const important = $('eventImportant').checked;
            if (editingEventId) {
                Object.assign(state.events.find(e => e.id === editingEventId), { title, start, important });
            } else {
                state.events.push({ id: uid(), title, start, important });
            }
            selDate = start;
            const d = parseYmd(start); calY = d.getFullYear(); calM = d.getMonth();
            save(); renderCalendar();
            closeModal('eventModal');
        }
        $('saveEventBtn').addEventListener('click', saveEvent);
        onEnter($('eventName'), saveEvent);
        $('deleteEventBtn').addEventListener('click', () => {
            if (!editingEventId) return;
            const idx = state.events.findIndex(e => e.id === editingEventId);
            if (idx < 0) return;
            const [item] = state.events.splice(idx, 1);
            save(); renderCalendar();
            closeModal('eventModal');
            toast('已刪除行程', { label: '復原', fn: () => { state.events.splice(idx, 0, item); save(); renderCalendar(); } });
        });

        /* =====================================================
         * 4. 待辦
         * ===================================================== */
        function renderTodos() {
            $('todoList').innerHTML = state.todos.length
                ? state.todos.map(t => `
                    <li class="check-item" data-id="${t.id}">
                        <input type="checkbox" class="checkbox" aria-label="完成">
                        <span class="text">${esc(t.text)}</span>
                        <button class="del-btn" aria-label="刪除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
                    </li>`).join('')
                : '<li class="empty">目前沒有待辦事項，太棒了！</li>';

            }, 200);

        $('todoList').addEventListener('change', (e) => { if (e.target.checked) removeTodo(e.target.closest('li'), '完成一項，讚！'); });
        $('todoList').addEventListener('click', (e) => { if (e.target.closest('.del-btn')) removeTodo(e.target.closest('li'), '已刪除'); });
        function addTodo() {
