<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>學測倒數 & 讀書計畫</title>

    <!-- ===== PWA 設定 ===== -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050608">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="學測倒數">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- 畫面出現前先套用主題：有手動選過就用選過的，否則跟著手機設定 -->
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('study_theme'); } catch (e) {}
            if (t !== 'light' && t !== 'dark') {
                t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body data-tab="tab-countdown">

    <!-- 頂部列 -->
    <header class="topbar">
        <h1 class="topbar-title zh" id="pageTitle">倒數計時</h1>
        <div class="topbar-actions">
            <button class="icon-btn" id="themeBtn" aria-label="切換深淺色">
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <button class="icon-btn avatar-btn" id="accountBtn" aria-label="帳號與同步">
                <img id="avatarImg" alt="" referrerpolicy="no-referrer">
            </button>
        </div>
    </header>

    <main class="main">

        <!-- ========== 1. 倒數 ========== -->
        <section id="tab-countdown" class="tab active">
            <div class="narrow">
                <div class="hero">
                    <p class="eyebrow" id="cdEyebrow">116 學測</p>
                    <div class="days num" id="days">00</div>
                    <p class="days-label">DAYS 天</p>
                    <div class="hms num">
                        <div><span id="hours">00</span><small>時</small></div>
                        <span class="colon">:</span>
                        <div><span id="minutes">00</span><small>分</small></div>
                        <span class="colon">:</span>
                        <div><span id="seconds">00</span><small>秒</small></div>
                    </div>
                    <p class="hero-date" id="cdDate"></p>
                    <p class="hero-note" id="cdNote"></p>
                </div>

                <div class="chips" id="examChips" role="tablist" aria-label="選擇考試"></div>

                <button class="btn btn-outline-accent btn-wide" id="rouletteBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="15" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="9" cy="15" r="1"/></svg>
                    現在要讀什麼？轉一下
                </button>

                <section class="block">
                    <div class="block-head">
                        <p class="label">今日進度</p>
                        <span class="count num" id="todayCount"></span>
                    </div>
                    <ul class="check-list" id="todayList"></ul>
                    <p class="next-line" id="nextExamLine"></p>
                </section>
            </div>
        </section>

        <!-- ========== 2. 每週進度 ========== -->
        <section id="tab-weekly" class="tab">
            <div class="week-head">
                <button class="icon-btn" id="prevWeekBtn" aria-label="上一週">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
                </button>
                <div class="week-center">
                    <div class="week-range num" id="weekRange"></div>
                    <div class="week-sub" id="weekSub"></div>
                </div>
                <button class="icon-btn" id="nextWeekBtn" aria-label="下一週">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
                </button>
            </div>
            <div class="progress"><div id="weekBar"></div></div>
            <div class="week-tools"><button class="btn btn-small" id="thisWeekBtn">回到本週</button></div>

            <!-- 手機：選一天，看當天各科 -->
            <div class="mobile-only narrow">
                <div class="day-chips" id="dayChips"></div>
                <p class="label" id="dayLabel"></p>
                <div id="dayPlan"></div>
            </div>
            <!-- 平板、電腦：整週表格 -->
            <div class="desktop-only table-wrap">
                <table class="week-table" id="weekTable"></table>
            </div>
        </section>

        <!-- ========== 3. 行事曆 ========== -->
        <!-- ========== 5. 讀書計時 ========== -->
        <section id="tab-timer" class="tab"></section>

        <!-- ========== 6. 統計 ========== -->
        <section id="tab-stats" class="tab"></section>

        <section id="tab-calendar" class="tab">
          <div class="cal-layout">
            <div class="cal-main">
            <div class="cal-head">
                <div>
                    <div class="cal-year num" id="calYear"></div>
                    <div class="cal-month" id="calMonth"></div>
                </div>
                <div class="cal-nav">
                    <button class="icon-btn" id="prevMonthBtn" aria-label="上個月">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
                    </button>
                    <button class="btn btn-small" id="todayMonthBtn" style="min-height:44px">今天</button>
                    <button class="icon-btn" id="nextMonthBtn" aria-label="下個月">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
                    </button>
                </div>
            </div>
            <div class="cal-weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
            <div class="cal-grid" id="calGrid"></div>
            <div class="legend">
                <span><i></i>行程</span>
                <span><i class="imp"></i>重要</span>
                <span><i class="ring"></i>考試</span>
            </div>
            </div>
            <aside class="cal-lists">
                <section class="block">
                    <div class="block-head">
                        <strong class="zh" id="selDayTitle" style="font-size:15px"></strong>
                        <button class="btn btn-small" id="addOnDayBtn">＋ 新增</button>
                    </div>
                    <ul class="event-list" id="selDayList"></ul>
                </section>
                <section class="block">
                    <div class="block-head"><p class="label">接下來</p></div>
                    <ul class="event-list" id="upcomingList"></ul>
                </section>
            </aside>
          </div>
            <button class="fab" id="calFab" aria-label="新增行程">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
        </section>

        <!-- ========== 4. 待辦 ========== -->
        <section id="tab-todo" class="tab">
            <div class="narrow">
                <div class="input-row">
                    <input type="text" class="text-input" id="todoInput" placeholder="新增待辦事項..." enterkeyhint="done" aria-label="新增待辦事項">
                    <button class="btn btn-accent" id="addTodoBtn">新增</button>
                </div>
                <ul class="check-list todo-list" id="todoList"></ul>
            </div>
        </section>
    </main>

    <!-- 底部分頁列 -->
    <nav class="tabbar" aria-label="主選單">
        <button class="tab-btn active" data-tab="tab-countdown" data-title="倒數計時">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>倒數</button>
        <button class="tab-btn" data-tab="tab-weekly" data-title="每週進度">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>進度</button>
        <button class="tab-btn" data-tab="tab-timer" data-title="讀書計時">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 9 9h-9z"/></svg>計時</button>
        <button class="tab-btn" data-tab="tab-calendar" data-title="行事曆">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>行事曆</button>
        <button class="tab-btn" data-tab="tab-todo" data-title="待辦事項">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11M3.5 18l1.5 1.5L7.5 17"/></svg>待辦</button>
    </nav>

    <!-- 轉盤 -->
    <div class="modal" id="rouletteModal" role="dialog" aria-modal="true" aria-labelledby="rouletteTitle">
        <div class="sheet">
            <h2 id="rouletteTitle">現在要讀：</h2>
            <div class="roulette-result" id="rouletteResult">？</div>
            <div class="sheet-btns" id="rouletteBtns" style="visibility:hidden">
                <button class="btn" id="spinAgainBtn">再轉一次</button>
                <button class="btn btn-accent" data-close>好！去讀書</button>
            </div>
        </div>
    </div>

    <!-- 每週進度編輯 -->
    <div class="modal" id="weeklyModal" role="dialog" aria-modal="true" aria-labelledby="weeklyTitle">
        <div class="sheet">
            <h2 id="weeklyTitle">編輯進度</h2>
            <label class="field-label" for="weeklyText">讀書進度</label>
            <textarea class="field" id="weeklyText" placeholder="例如：第三章習題 p.42–48"></textarea>
            <span class="field-label">標記顏色</span>
            <div class="colors" id="colorPicker">
                <button class="color-dot" data-color="" aria-label="無顏色"></button>
                <button class="color-dot" data-color="green" aria-label="綠色"></button>
                <button class="color-dot" data-color="blue" aria-label="藍色"></button>
                <button class="color-dot" data-color="yellow" aria-label="黃色"></button>
                <button class="color-dot" data-color="pink" aria-label="粉紅色"></button>
            </div>
            <label class="toggle-row"><input type="checkbox" class="checkbox" id="weeklyDone">已完成</label>
            <div class="sheet-btns">
                <button class="btn btn-danger" id="clearWeeklyBtn">清除</button>
                <span class="spacer"></span>
                <button class="btn" data-close>取消</button>
                <button class="btn btn-accent" id="saveWeeklyBtn">儲存</button>
            </div>
        </div>
    </div>

    <!-- 行程新增／編輯 -->
    <div class="modal" id="eventModal" role="dialog" aria-modal="true" aria-labelledby="eventTitle">
        <div class="sheet">
            <h2 id="eventTitle">新增行程</h2>
            <label class="field-label" for="eventName">行程內容</label>
            <input type="text" class="field" id="eventName" placeholder="例如：英文小考" enterkeyhint="done">
            <label class="field-label" for="eventDate">日期</label>
            <input type="date" class="field" id="eventDate">
            <label class="toggle-row imp"><input type="checkbox" class="checkbox" id="eventImportant">標記為重要</label>
            <div class="sheet-btns">
                <button class="btn btn-danger" id="deleteEventBtn">刪除</button>
                <span class="spacer"></span>
                <button class="btn" data-close>取消</button>
                <button class="btn btn-accent" id="saveEventBtn">儲存</button>
            </div>
        </div>
    </div>

    <!-- 帳號 -->
    <div class="modal" id="accountModal" role="dialog" aria-modal="true" aria-labelledby="accountTitle">
        <div class="sheet">
            <h2 id="accountTitle">帳號與同步</h2>
            <div class="account">
                <img id="accountAvatar" alt="" referrerpolicy="no-referrer">
                <div>
                    <div class="name" id="accountName">未登入</div>
                    <div class="status" id="accountStatus">資料只存在這台裝置</div>
                </div>
            </div>
            <p class="empty" id="accountHint" style="padding-top:0">登入 Google 帳號後，資料會自動同步到雲端，換手機或電腦也看得到。</p>
            <div class="sheet-btns">
                <button class="btn" data-close>關閉</button>
                <button class="btn btn-accent" id="loginBtn">使用 Google 登入</button>
            </div>
        </div>
    </div>

    <!-- 補登讀書時間 -->
    <div class="modal" id="logModal" role="dialog" aria-modal="true" aria-labelledby="logTitle">
        <div class="sheet">
            <h2 id="logTitle">補登讀書時間</h2>
            <label class="field-label" for="logSubject">科目</label>
            <select class="field" id="logSubject"></select>
            <div class="field-row">
                <div><label class="field-label" for="logDate">日期</label><input type="date" class="field" id="logDate"></div>
                <div><label class="field-label" for="logTime">開始時間</label><input type="time" class="field" id="logTime"></div>
            </div>
            <label class="field-label" for="logMinutes">讀了幾分鐘</label>
            <input type="number" class="field" id="logMinutes" min="1" max="600" step="5" inputmode="numeric" value="25">
            <div class="sheet-btns">
                <button class="btn" data-close>取消</button>
                <button class="btn btn-accent" id="saveLogBtn">儲存</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="app.js"></script>

    <!-- PWA：註冊 Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(err => console.log('Service Worker 註冊失敗：', err));
            });
        }
    </script>
</body>
</html>
